name: Build Dahaengi.exe

on:
  push:
    paths:
      - "dahaengi/**"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.11.1

      - name: Build exe
        working-directory: dahaengi
        run: python -m PyInstaller --noconfirm --onefile --noconsole --name Dahaengi --icon icon.ico dahaengi.py

      - name: Smoke test (launch exe, drop pet on Notepad, take screenshot)
        working-directory: dahaengi
        shell: pwsh
        timeout-minutes: 3
        run: |
          $log = Join-Path $PWD "selftest.log"
          Start-Process notepad
          Start-Sleep -Seconds 2
          $p = Start-Process -FilePath "dist\Dahaengi.exe" -ArgumentList "--selftest", "`"$log`"" -PassThru
          Start-Sleep -Seconds 8
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("screenshot.png")
          $p.WaitForExit()
          Get-Content $log
          if ($p.ExitCode -ne 0) { throw "selftest failed with exit code $($p.ExitCode)" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Dahaengi
          path: |
            dahaengi/dist/Dahaengi.exe
            dahaengi/screenshot.png

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 다행이 v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dahaengi/dist/Dahaengi.exe
          body: |
            **Dahaengi.exe** 를 받아서 더블클릭하면 바로 실행돼요. (설치 필요 없음)

            처음 실행할 때 "Windows의 PC 보호" 창이 뜨면 **추가 정보 → 실행**을 눌러 주세요.
            (서명되지 않은 개인 제작 프로그램이라 뜨는 경고예요.)
