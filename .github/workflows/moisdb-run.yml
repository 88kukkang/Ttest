name: moisdb-run

# ci/task.env 를 바꿔 push 하면 실행된다.
#   update  : 매일 갱신 (예약 실행이 RUN 값을 올려 push). 결과는 릴리스 data-latest 에 덮어쓴다.
#   collect : 처음 전체 수집 / recon, probe : 점검
on:
  push:
    branches: [claude/moi-press-release-database-ncgqwa]
    paths: [ci/task.env]

permissions:
  contents: write

concurrency:
  group: moisdb-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[analysis]"
      - name: Read task
        run: grep '^TASK=' ci/task.env >> "$GITHUB_ENV"
      # 실행 사이에는 DB 만 이어 쓴다 (원본 HTML·첨부는 추출이 끝나면 필요 없음)
      - name: Restore collected data
        uses: actions/cache/restore@v4
        with:
          path: |
            data/mois.sqlite3
            data/.discover_done
          key: moisdb-db-${{ github.run_id }}
          restore-keys: moisdb-db-
      - name: Run task
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/run.sh
      - name: Save collected data
        if: always() && hashFiles('data/mois.sqlite3') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            data/mois.sqlite3
            data/.discover_done
          key: moisdb-db-${{ github.run_id }}
      - name: Upload full data (원본 HTML·첨부 포함, 전체 수집 때만)
        if: always() && env.TASK == 'collect' && hashFiles('data/mois.sqlite3') != ''
        uses: actions/upload-artifact@v4
        with:
          name: moisdb-data-full
          path: data
          retention-days: 30
      - name: Commit recon samples
        if: always() && env.TASK == 'recon'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          if [ -e samples ]; then git add -f samples; fi
          if git diff --cached --quiet; then echo "커밋할 결과 없음"; exit 0; fi
          git commit -m "moisdb-run: recon 결과"
          for i in 1 2 3 4; do git pull --rebase origin "$GITHUB_REF_NAME" && git push && break; sleep $((2**i)); done
