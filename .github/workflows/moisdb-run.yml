name: moisdb-run

# ci/task.env 를 바꿔 push 하면 실행된다. 결과(dataset/, reports/, samples/)는 같은 브랜치에 커밋된다.
on:
  push:
    branches: [claude/moi-press-release-database-ncgqwa]
    paths: [ci/task.env]

permissions:
  contents: write

concurrency:
  group: moisdb-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[analysis]"
      - name: Restore collected data
        uses: actions/cache/restore@v4
        with:
          path: data
          key: moisdb-data-${{ github.run_id }}
          restore-keys: moisdb-data-
      - name: Run task
        run: bash ci/run.sh
      - name: Save collected data
        if: always() && hashFiles('data/mois.sqlite3') != ''
        uses: actions/cache/save@v4
        with:
          path: data
          key: moisdb-data-${{ github.run_id }}
      - name: Upload full data (원본 HTML·첨부 포함)
        if: always() && hashFiles('data/mois.sqlite3') != ''
        uses: actions/upload-artifact@v4
        with:
          name: moisdb-data-full
          path: data
          retention-days: 30
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          for d in samples dataset reports; do if [ -e "$d" ]; then git add -f "$d"; fi; done
          if git diff --cached --quiet; then echo "커밋할 결과 없음"; exit 0; fi
          git commit -m "moisdb-run: $(grep '^TASK=' ci/task.env) 결과"
          for i in 1 2 3 4; do git pull --rebase origin "$GITHUB_REF_NAME" && git push && break; sleep $((2**i)); done
